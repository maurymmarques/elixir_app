name: Elixir CI

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Elixir tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

  trigger-playwright:
    name: Trigger Playwright tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Trigger Playwright workflow
        env:
          GH_TOKEN: ${{ secrets.PLAYWRIGHT_REPO_TOKEN }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/maurymmarques/playwright-tests/actions/workflows/playwright.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --header "Content-Type: application/json" \
            --data '{
              "ref": "main",
              "inputs": {
                "source_repository": "${{ github.repository }}",
                "source_sha": "${{ github.sha }}"
              }
            }'